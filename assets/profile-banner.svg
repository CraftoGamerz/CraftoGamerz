<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Abusina Hossain</title>
  <desc id="desc">A dark midnight banner with cyan and violet neural-network lines, for an AI and machine learning student who combines technology and visual design.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.54" stop-color="#10172B"/>
      <stop offset="1" stop-color="#17102F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66F0FF"/>
      <stop offset="0.52" stop-color="#6C8DFF"/>
      <stop offset="1" stop-color="#B18CFF"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#91A4D8" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <circle cx="1000" cy="150" r="280" fill="url(#glow)"/>
  <path d="M0 275 C210 230 330 330 525 260 S850 185 1200 240" fill="none" stroke="url(#accent)" stroke-opacity="0.18" stroke-width="1.3"/>
  <path d="M0 294 C230 250 352 338 540 280 S870 205 1200 260" fill="none" stroke="url(#accent)" stroke-opacity="0.11" stroke-width="1.2"/>
  <g stroke="url(#accent)" stroke-width="1.35" stroke-opacity="0.55" fill="none">
    <path d="M735 72 L805 106 L864 55 L922 100 L1002 56 L1067 99 L1141 63"/>
    <path d="M765 167 L826 124 L888 164 L922 100 L1003 157 L1067 99 L1138 152"/>
    <path d="M826 124 L805 106 L765 167 L824 211 L888 164 L902 233 L1003 205 L1003 157"/>
    <path d="M888 164 L1003 157 L1080 208 L1138 152 L1162 218"/>
    <path d="M922 100 L902 233 L1003 205 L1080 208 L1162 218"/>
    <path d="M1002 56 L1003 157 L1003 205"/>
  </g>
  <g fill="#92F3FF" filter="url(#softGlow)">
    <circle cx="735" cy="72" r="3.2"/><circle cx="805" cy="106" r="3.5"/><circle cx="864" cy="55" r="3.1"/>
    <circle cx="922" cy="100" r="4.1"/><circle cx="1002" cy="56" r="3.2"/><circle cx="1067" cy="99" r="3.7"/>
    <circle cx="1141" cy="63" r="3.0"/><circle cx="765" cy="167" r="3.4"/><circle cx="826" cy="124" r="3.0"/>
    <circle cx="888" cy="164" r="4.0"/><circle cx="1003" cy="157" r="4.5"/><circle cx="1138" cy="152" r="3.3"/>
    <circle cx="824" cy="211" r="3.0"/><circle cx="902" cy="233" r="3.5"/><circle cx="1003" cy="205" r="3.8"/>
    <circle cx="1080" cy="208" r="3.0"/><circle cx="1162" cy="218" r="3.1"/>
  </g>
  <g fill="#070B14" stroke="url(#accent)" stroke-width="1.4" stroke-opacity="0.8">
    <circle cx="805" cy="106" r="7"/><circle cx="922" cy="100" r="8"/><circle cx="1003" cy="157" r="9"/><circle cx="888" cy="164" r="7"/>
  </g>
  <path d="M660 28 V292" stroke="url(#accent)" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="3 7"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="55" font-size="13" letter-spacing="4" fill="#8DA4D7">CRAFTOGAMERZ / PROFILE</text>
    <rect x="64" y="79" width="62" height="4" rx="2" fill="url(#accent)"/>
    <text x="60" y="148" font-size="56" font-weight="750" letter-spacing="-1.5" fill="#F2F7FF">ABUSINA HOSSAIN</text>
    <text x="64" y="186" font-size="20" font-weight="500" letter-spacing="2.4" fill="#83E9FF">ARTIFICIAL INTELLIGENCE  /  MACHINE LEARNING</text>
    <text x="64" y="222" font-size="16" fill="#B9C6E7">Building ideas into useful prototypes — one experiment at a time.</text>
    <g transform="translate(64 250)">
      <rect width="113" height="30" rx="15" fill="#102738" stroke="#49D9F4" stroke-opacity="0.6"/>
      <text x="56.5" y="19.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.5" fill="#9DEFFF">AI / ML</text>
      <rect x="124" width="140" height="30" rx="15" fill="#201B3E" stroke="#A78BFA" stroke-opacity="0.65"/>
      <text x="194" y="19.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.3" fill="#D3C3FF">CREATIVE TECH</text>
      <rect x="275" width="122" height="30" rx="15" fill="#112A27" stroke="#52D8B0" stroke-opacity="0.55"/>
      <text x="336" y="19.5" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.3" fill="#99F4D7">BUILD / LEARN</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="21" fill="none" stroke="#7C8DBA" stroke-opacity="0.3"/>
</svg>
